# Untagged tasks target today's sole untagged GPU worker. Do not add tags until
# the GPU fleet placement migration is coordinated with the existing GPU jobs.
resources:
  - name: probe-inputs
    type: s3
    source:
      endpoint: ((minio_endpoint))
      bucket: ncm-fewnerd-probes
      regexp: fewnerd/inputs/probe-inputs-(1\.0\.0)\.tar\.gz
      access_key_id: ((minio_access_key))
      secret_access_key: ((minio_secret_key))
      region_name: us-east-1
      disable_ssl: true
  - name: gpu-lock
    type: pool
    source:
      uri: git@github.com:gavmor/concourse-locks.git
      branch: main
      pool: gpu
      private_key: ((gpu_lock_repo_private_key))
  - name: probe-results
    type: s3
    source:
      endpoint: ((minio_endpoint))
      bucket: ncm-fewnerd-probes
      regexp: fewnerd/results/fewnerd-probe-(.*)\.tar\.gz
      access_key_id: ((minio_access_key))
      secret_access_key: ((minio_secret_key))
      region_name: us-east-1
      disable_ssl: true
jobs:
  - name: full-probe
    serial: true
    serial_groups: [gpu]
    plan:
      - get: probe-inputs
      - task: preflight
        timeout: 10m
        config:
          platform: linux
          image_resource: &probe-image
            type: registry-image
            source:
              repository: 192.168.16.1:5000/ncm-fewnerd-probe
              insecure: true
            version:
              digest: ((probe_image_digest))
          inputs: [{name: probe-inputs}]
          outputs: [{name: prepared}]
          params:
            CUDA_VISIBLE_DEVICES: ''
            INPUT_SHA256: ((probe_input_sha256))
            AWS_ACCESS_KEY_ID: ((minio_access_key))
            AWS_SECRET_ACCESS_KEY: ((minio_secret_key))
            NCM_S3_ENDPOINT: ((minio_endpoint))
          run:
            path: bash
            args:
              - -ec
              - |
                printf '%s  %s\n' "$INPUT_SHA256" probe-inputs/probe-inputs-1.0.0.tar.gz | sha256sum -c -
                tar -xzf probe-inputs/probe-inputs-1.0.0.tar.gz -C prepared
                export HF_HOME="$PWD/prepared/hf-cache"
                export NCM_CORPORA_ROOT="$PWD/prepared/corpora"
                cd prepared/repo
                export PYTHONPATH="$PWD/src:$PWD/third_party/ncm"
                python - <<'PY'
                import os, shutil, boto3, torch
                from pathlib import Path
                from ncm_graphrag.data.fewnerd_extraction import _build
                from ncm_graphrag.ncm.task_registry import TASKS
                available_kib = int(next(line.split()[1] for line in Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemAvailable:')))
                assert available_kib >= 24 * 1024**2, 'Need 24 GiB available host RAM'
                assert shutil.disk_usage('.').free >= 20 * 1024**3, 'Need 20 GiB free task disk'
                assert torch.__version__ == '2.14.1+cu130'
                assert len(_build('train')) >= 50000
                assert len(TASKS['fewnerd_extraction'].benchmark_examples()) == 300
                boto3.client('s3', endpoint_url=os.environ['NCM_S3_ENDPOINT']).head_bucket(Bucket='ncm-fewnerd-probes')
                print('Preflight passed: pinned dependencies, dataset, 300 held-out examples, RAM, disk, persistent store')
                PY
                python -m unittest discover -s tests -v
      - put: gpu-lock
        params: {acquire: true}
      - task: train-and-evaluate
        timeout: 2h
        config:
          platform: linux
          image_resource: *probe-image
          container_limits:
            memory: 34359738368
          inputs: [{name: prepared}]
          outputs: [{name: results}]
          params:
            NVIDIA_VISIBLE_DEVICES: all
            NVIDIA_DRIVER_CAPABILITIES: all
            NCM_GPU_LOCK_HELD: '1'
            NCM_CHECKPOINT_BUCKET: ncm-fewnerd-probes
            NCM_CHECKPOINT_PREFIX: fewnerd/runs/20261031-probe1
            NCM_S3_ENDPOINT: ((minio_endpoint))
            NCM_IMAGE_DIGEST: ((probe_image_digest))
            NCM_INPUT_SHA256: ((probe_input_sha256))
            AWS_ACCESS_KEY_ID: ((minio_access_key))
            AWS_SECRET_ACCESS_KEY: ((minio_secret_key))
          run:
            path: bash
            args:
              - -ec
              - |
                set -o pipefail
                export HF_HOME="$PWD/prepared/hf-cache"
                export NCM_CORPORA_ROOT="$PWD/prepared/corpora"
                OUTPUT="$PWD/results/probe"
                LOG="$PWD/results/probe.log"
                printf '{"image_digest":"%s","input_sha256":"%s"}\n' "$NCM_IMAGE_DIGEST" "$NCM_INPUT_SHA256" > results/runtime.json
                cd prepared/repo
                export PYTHONPATH="$PWD/src:$PWD/third_party/ncm"
                nvidia-smi
                python -u scripts/fewnerd_probe.py --output "$OUTPUT" 2>&1 | tee "$LOG"
        ensure:
          do:
            # Foreground task process owns its CUDA context. On worker loss,
            # verify process death before any manual stranded-lock release.
            - put: gpu-lock
              params: {release: gpu-lock}
            - task: package-results
              timeout: 15m
              config:
                platform: linux
                image_resource: *probe-image
                inputs: [{name: results}]
                outputs: [{name: package}]
                run:
                  path: bash
                  args:
                    - -ec
                    - |
                      tar -czf "package/fewnerd-probe-$(date -u +%Y%m%dT%H%M%SZ).tar.gz" -C results .
            - put: probe-results
              params:
                file: package/fewnerd-probe-*.tar.gz
