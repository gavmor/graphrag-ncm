# T1 conditional loss ablation: same definition as T0 except the protocol arm and pins.
# Adapted from genops-pipelines/concourse/gpu-workload-template.yml at
# 22fd687e06f83b7aea8ccb466570b2197905d1b2 (blob 066caf22ff0e12b18a6c25f0797689dbf060eb9b).
# The upstream URL returned 404; the pinned local copy supplied the template.
# Untagged tasks use the existing untagged worker and reuse the pinned dependency
# image without installation. Preflight and CPU evaluation never hold the GPU lock.
# Release and publication are best effort on worker/backend loss. A failed release
# stops the ensure sequence, so evaluation/publication cannot run in that case.
# Before manually releasing a stranded lock, verify the foreground CUDA process is dead.
resource_types:
  - name: pool
    type: registry-image
    source:
      repository: concourse/pool-resource
resources:
  - name: quality-inputs
    type: s3
    source:
      endpoint: ((minio_endpoint))
      bucket: ncm-fewnerd-probes
      regexp: fewnerd/quality/inputs/(fewnerd-quality-inputs-((t1_input_version)))\.tar\.gz
      access_key_id: ((minio_access_key))
      secret_access_key: ((minio_secret_key))
      region_name: us-east-1
      disable_ssl: true
  - name: gpu-lock
    type: pool
    source:
      uri: git@github.com:gavmor/concourse-locks.git
      branch: main
      pool: gpu
      private_key: ((gpu_lock_repo_private_key))
  - name: t1-results
    type: s3
    source:
      endpoint: ((minio_endpoint))
      bucket: ncm-fewnerd-probes
      regexp: fewnerd/quality/t1-results/(fewnerd-t1-((t1_result_version)))\.tar\.gz
      access_key_id: ((minio_access_key))
      secret_access_key: ((minio_secret_key))
      region_name: us-east-1
      disable_ssl: true
jobs:
  - name: schedule-control
    serial: true
    serial_groups: [gpu]
    plan:
      - get: quality-inputs
        trigger: false
      - task: preflight
        timeout: 30m
        config:
          platform: linux
          image_resource: &t1-image
            type: registry-image
            source:
              repository: 192.168.16.1:5000/ncm-fewnerd-quality-control
              insecure: true
            version:
              digest: ((t1_image_digest))
          inputs: [{name: quality-inputs}]
          outputs: [{name: prepared}, {name: prep-log}]
          params:
            CUDA_VISIBLE_DEVICES: ''
            NVIDIA_VISIBLE_DEVICES: void
            HF_HUB_OFFLINE: '1'
            TRANSFORMERS_OFFLINE: '1'
            INPUT_VERSION: ((t1_input_version))
            INPUT_SHA256: ((t1_input_sha256))
            AWS_ACCESS_KEY_ID: ((minio_access_key))
            AWS_SECRET_ACCESS_KEY: ((minio_secret_key))
            NCM_S3_ENDPOINT: ((minio_endpoint))
          run:
            path: bash
            args:
              - -ec
              - |
                set -uo pipefail
                mkdir -p prepared prep-log
                exec > >(tee prep-log/prepare.log) 2>&1
                export PREP_LOG="$PWD/prep-log"
                ARCHIVE="quality-inputs/fewnerd-quality-inputs-${INPUT_VERSION}.tar.gz"
                printf '%s  %s\n' "$INPUT_SHA256" "$ARCHIVE" | sha256sum -c -
                python - <<'PY'
                import shutil
                from pathlib import Path
                available = int(next(line.split()[1] for line in Path('/proc/meminfo').read_text().splitlines() if line.startswith('MemAvailable:')))
                assert available >= 24 * 1024**2, 'Need 24 GiB available RAM'
                assert shutil.disk_usage('prepared').free >= 20 * 1024**3, 'Need 20 GiB free disk'
                PY
                tar -xzf "$ARCHIVE" -C prepared
                export HF_HOME="$PWD/prepared/hf-cache"
                export NCM_CORPORA_ROOT="$PWD/prepared/corpora"
                cd prepared/repo
                export PYTHONPATH="$PWD/src:$PWD/third_party/ncm"
                test -x /usr/bin/time
                /usr/bin/time --version
                python - <<'PY'
                import hashlib, os
                from pathlib import Path
                import boto3, torch, transformers, tokenizers, omegaconf, numpy
                from ncm_graphrag.ncm import train_tokenizer
                assert torch.__version__ == '2.14.1+cu130', torch.__version__
                assert torch.version.cuda == '13.0', torch.version.cuda
                image_lock = hashlib.sha256(Path('/opt/ncm-image/uv.lock').read_bytes()).hexdigest()
                source_lock = hashlib.sha256(Path('uv.lock').read_bytes()).hexdigest()
                assert image_lock == source_lock, 'Image and staged uv.lock differ'
                Path(os.environ['PREP_LOG'], 'uv-lock-sha256.txt').write_text(source_lock + '\n')
                boto3.client('s3', endpoint_url=os.environ['NCM_S3_ENDPOINT']).head_bucket(Bucket='ncm-fewnerd-probes')
                print('Pinned image dependencies, GNU time, RAM, disk and persistent store ready')
                PY
                python -u -m ncm_graphrag.ncm.fewnerd_t0 --protocol benchmarks/fewnerd-t1.json --preflight | tee "$PREP_LOG/runner-preflight.log"
                python - <<'PY'
                import json, os
                from pathlib import Path
                lines = Path(os.environ['PREP_LOG'], 'runner-preflight.log').read_text().splitlines()
                configs = [json.loads(line.removeprefix('T1_CONFIG ')) for line in lines if line.startswith('T1_CONFIG ')]
                assert len(configs) == 1, 'Missing unique T1 runner configuration'
                config = configs[0]
                assert config['training_ready'] is True, config.get('protocol_issues', config)
                assert config['steps'] == 6000, 'Only the bounded 6000-update T1 schedule is authorized'
                assert config['batch_size'] == 128, 'T1 requires batch size 128'
                assert config['evaluation_steps'] == [1500, 3000, 6000], 'T1 evaluation checkpoints differ'
                PY
                python -m unittest discover -s tests -v 2>&1 | tee "$PREP_LOG/tests.log"
                python -m pip freeze > "$PREP_LOG/dependencies.txt"
      - put: gpu-lock
        params: {acquire: true}
      - task: train-t1
        timeout: 90m
        config:
          platform: linux
          image_resource: *t1-image
          container_limits:
            memory: 34359738368
          inputs: [{name: prepared}]
          outputs: [{name: results}]
          params:
            NVIDIA_VISIBLE_DEVICES: all
            NVIDIA_DRIVER_CAPABILITIES: all
            NCM_GPU_LOCK_HELD: '1'
            NCM_CHECKPOINT_BUCKET: ncm-fewnerd-probes
            NCM_CHECKPOINT_PREFIX: ((t1_checkpoint_prefix))
            NCM_S3_ENDPOINT: ((minio_endpoint))
            NCM_IMAGE_DIGEST: ((t1_image_digest))
            NCM_INPUT_SHA256: ((t1_input_sha256))
            AWS_ACCESS_KEY_ID: ((minio_access_key))
            AWS_SECRET_ACCESS_KEY: ((minio_secret_key))
            CUBLAS_WORKSPACE_CONFIG: ':4096:8'
            HF_HUB_OFFLINE: '1'
            TRANSFORMERS_OFFLINE: '1'
          run:
            path: bash
            args:
              - -ec
              - |
                set -uo pipefail
                export RESULT_ROOT="$PWD/results"
                export SOURCE_INFO="$PWD/prepared/source-info.json"
                export HF_HOME="$PWD/prepared/hf-cache"
                export NCM_CORPORA_ROOT="$PWD/prepared/corpora"
                mkdir -p "$RESULT_ROOT"
                exec > >(tee "$RESULT_ROOT/task.log") 2>&1
                SAMPLER=
                cleanup() {
                  local rc=$?
                  trap - EXIT
                  if [ -n "$SAMPLER" ]; then
                    kill "$SAMPLER" 2>/dev/null || true
                    wait "$SAMPLER" 2>/dev/null || true
                  fi
                  exit "$rc"
                }
                trap cleanup EXIT
                cd prepared/repo
                export PYTHONPATH="$PWD/src:$PWD/third_party/ncm"
                nvidia-smi | tee "$RESULT_ROOT/nvidia-smi.txt"
                python - <<'PY'
                import json, os, platform, sys, torch
                from pathlib import Path
                assert torch.cuda.is_available(), 'CUDA unavailable'
                runtime = {
                    'image_digest': os.environ['NCM_IMAGE_DIGEST'],
                    'input_sha256': os.environ['NCM_INPUT_SHA256'],
                    'source': json.loads(Path(os.environ['SOURCE_INFO']).read_text()),
                    'python': sys.version, 'platform': platform.platform(),
                    'torch': str(torch.__version__), 'cuda': torch.version.cuda,
                    'device': torch.cuda.get_device_name(0),
                    'template_revision': '22fd687e06f83b7aea8ccb466570b2197905d1b2',
                    'template_blob': '066caf22ff0e12b18a6c25f0797689dbf060eb9b',
                }
                Path(os.environ['RESULT_ROOT'], 'runtime.json').write_text(json.dumps(runtime, indent=2) + '\n')
                PY
                nvidia-smi --query-gpu=timestamp,index,memory.used,memory.total,utilization.gpu --format=csv --loop=5 > "$RESULT_ROOT/gpu-samples.csv" 2> "$RESULT_ROOT/gpu-sampler.stderr" &
                SAMPLER=$!
                START=$(date +%s)
                set +e
                /usr/bin/time -v -o "$RESULT_ROOT/time-rss.txt" python -u -m ncm_graphrag.ncm.fewnerd_t0 --protocol benchmarks/fewnerd-t1.json --output-dir "$RESULT_ROOT/t1" 2>&1 | tee "$RESULT_ROOT/train.log"
                RUN_RC=${PIPESTATUS[0]}
                set -e
                kill "$SAMPLER" 2>/dev/null || true
                wait "$SAMPLER" 2>/dev/null || true
                SAMPLER=
                export START RUN_RC
                python - <<'PY'
                import csv, json, os, time
                from pathlib import Path
                root = Path(os.environ['RESULT_ROOT'])
                elapsed = time.time() - int(os.environ['START'])
                (root / 'wall-clock-seconds.txt').write_text(f'{elapsed:.3f}\n')
                (root / 'execution.json').write_text(json.dumps({'exit_code': int(os.environ['RUN_RC']), 'wall_clock_seconds': elapsed}, indent=2) + '\n')
                samples = list(csv.reader((root / 'gpu-samples.csv').open()))[1:]
                used = [int(row[2].split()[0]) for row in samples if len(row) == 5]
                (root / 'telemetry.json').write_text(json.dumps({
                    'sampling_interval_seconds': 5,
                    'gpu_sample_count': len(used),
                    'sampled_peak_vram_mib': max(used) if used else None,
                    'sampled_peak_is_lower_bound': True,
                    'memory_measurement': 'Whole-device nvidia-smi, not exclusive process VRAM',
                }, indent=2) + '\n')
                PY
                exit "$RUN_RC"
        ensure:
          do:
            # Always release FIRST; no CPU evaluation or packaging holds the lock.
            # Release failure stops this sequence; worker loss may also prevent publication.
            - put: gpu-lock
              params: {release: gpu-lock}
            - task: evaluate-t1
              timeout: 90m
              config:
                platform: linux
                image_resource: *t1-image
                container_limits:
                  memory: 34359738368
                inputs: [{name: prepared}, {name: results}]
                outputs: [{name: evaluated}]
                params:
                  NVIDIA_VISIBLE_DEVICES: void
                  CUDA_VISIBLE_DEVICES: ''
                  OMP_NUM_THREADS: '1'
                  MKL_NUM_THREADS: '1'
                  OPENBLAS_NUM_THREADS: '1'
                  HF_HUB_OFFLINE: '1'
                  TRANSFORMERS_OFFLINE: '1'
                  NCM_IMAGE_DIGEST: ((t1_image_digest))
                  NCM_INPUT_SHA256: ((t1_input_sha256))
                run:
                  path: bash
                  args:
                    - -ec
                    - |
                      set -uo pipefail
                      export RESULT_ROOT="$PWD/results"
                      export EVALUATION_ROOT="$PWD/evaluated"
                      export HF_HOME="$PWD/prepared/hf-cache"
                      export NCM_CORPORA_ROOT="$PWD/prepared/corpora"
                      mkdir -p "$EVALUATION_ROOT"
                      exec > >(tee "$EVALUATION_ROOT/task.log") 2>&1
                      cd prepared/repo
                      export PYTHONPATH="$PWD/src:$PWD/third_party/ncm"
                      START=$(date +%s)
                      set +e
                      /usr/bin/time -v -o "$EVALUATION_ROOT/time-rss.txt" python -u -m ncm_graphrag.ncm.fewnerd_t0 --protocol benchmarks/fewnerd-t1.json --evaluate-results "$RESULT_ROOT/t1" --evaluation-output "$EVALUATION_ROOT/t1" 2>&1 | tee "$EVALUATION_ROOT/evaluation.log"
                      RUN_RC=${PIPESTATUS[0]}
                      set -e
                      export START RUN_RC
                      python - <<'PY'
                      import json, os, time
                      from pathlib import Path
                      root = Path(os.environ['EVALUATION_ROOT'])
                      elapsed = time.time() - int(os.environ['START'])
                      (root / 'wall-clock-seconds.txt').write_text(f'{elapsed:.3f}\n')
                      (root / 'execution.json').write_text(json.dumps({'exit_code': int(os.environ['RUN_RC']), 'wall_clock_seconds': elapsed}, indent=2) + '\n')
                      PY
                      exit "$RUN_RC"
              ensure:
                do:
                  - task: package-results
                    timeout: 15m
                    config:
                      platform: linux
                      image_resource: *t1-image
                      inputs:
                        - {name: results}
                        - {name: evaluated, optional: true}
                        - {name: prep-log}
                      outputs: [{name: package}]
                      params:
                        NVIDIA_VISIBLE_DEVICES: void
                        CUDA_VISIBLE_DEVICES: ''
                        RESULT_VERSION: ((t1_result_version))
                      run:
                        path: bash
                        args:
                          - -ec
                          - |
                            set -uo pipefail
                            mkdir -p package
                            paths=(results prep-log)
                            if [ -d evaluated ]; then
                              paths+=(evaluated)
                            fi
                            tar -czf "package/fewnerd-t1-${RESULT_VERSION}.tar.gz" "${paths[@]}"
                  - put: t1-results
                    params:
                      file: package/fewnerd-t1-((t1_result_version)).tar.gz
